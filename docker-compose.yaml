services:

  postgres:
    image: postgres:16
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
      - ./app/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app/backend
    container_name: aegis-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aegis
      DB_USER: postgres
      DB_PASSWORD: postgres
      INCIDENT_DB_HOST: postgres
      INCIDENT_DB_PORT: 5432
      INCIDENT_DB_NAME: aegis_incidents
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
    container_name: aegis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./app/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./app/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aegis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./app/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - backend
    

volumes:
  aegis-postgres-data:
    external: true
    name: 3b53c292272e159de0bf683296a173333503d5c218f44193032d3bdb873174b5

  grafana-data:
  prometheus-data: